<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    <h2>unordered list</h2>
    <h2>Disc</h2>
    <ul style="list-style-type: disc;">
    <li>milk</li>
    <li>bread</li>
    <li>butter</li>
    <li>cheese</li>

    <h2>Circle</h2>
    </ul>
        <ul style="list-style-type: circle;">
    <li>milk</li>
    <li>bread</li>
    <li>butter</li>
    <li>cheese</li>

    <h2>square</h2>
    </ul>

        <ul style="list-style-type: square;">
    <li>milk</li>
    <li>bread</li>
    <li>butter</li>
    <li>cheese</li>

    <h2>None</h2>
    </ul>

        <ul style="list-style-type: none;">
    <li>milk</li>
    <li>bread</li>
    <li>butter</li>
    <li>cheese</li>

    </ul>
</body>
</html>
