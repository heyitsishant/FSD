<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive design 3</title>
    <style>
        .dashboard{
            display: grid;

            grid-template-columns: 250px 1fr;

             /* vh- view height */
            min-height: 100vh;
        }
        aside{
            background-color: black;
            color: white;
            padding: 20px;
        }
        main{
            padding: 20px;
        }
        @media(max-width:700px){
            .dashboard{
                grid-template-columns: 1fr;
            }
            aside{
                text-align: center;
            }
            main{
                text-align: center;
            }
        }
    </style>
</head>
<body>
     <div class="dashboard">
        <!--sidebar-->
         <aside>Sidebar</aside>
        <!--main-->
        <main>Main content</main>
     </div>
</body>
</html>
