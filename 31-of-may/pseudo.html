<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<style>
    .divtag{
        width: 100px;
        height: 100px;
        margin: 50px;
        border: 2px solid black;
    }
    /*identifies the user mouse on the tag*/
    .divtag:hover{
    /*transform the size by 20% increase*/
    transform: scale(1.2);
    }
</style>
<body>
     <div class="divtag">hover me</div>
</body>
</html>
