<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>box model</title>
    <style>
        .normal{
            width: 300px;
            padding: 20px;
            border: 10px solid red;
        }
        .better{
            width: 200px;
            padding: 20px;
            border: 10px solid green;
 
            /* make sure that the full box should be equl to the given width and height*/
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="normal"> Normal</div>
    <div class="better">Border box</div>
</body>
</html>
