<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> break the flow</title>
    <style>
        .box{
           border: 1px solid black;
            margin: 20px;
            padding: 20px;
            height: 100px;
            text-align: center;
        }
        .popup{
            /* break the normal flow*/
            position: absolute;
            top: 20px;
            right: 20px;
        }
    </style>
</head>
<body>
  <div class="box"> box </div>
 <div class="popup">popup</div>
</body>
</html>
