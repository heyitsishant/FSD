<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>block level element</title>
    <style>
        .box{
            padding: 20px;
            color: white;
            margin: 10px;
        }
        .red{
            background-color: red;
        }
        .blue{
            background-color: blue;
        }
        .pink{
            background-color: pink;
        }
    </style>
</head>
<body>
    <div class="red">box 1</div>
    <div class="blue">box 2</div>
    <div class="pink">box 3</div>
</body>
</html>
