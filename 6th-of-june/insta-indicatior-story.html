<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .profile{
            position: relative;
            width: 100px;
            height: 100px;
            background-color: gray;
            border-radius: 50%;
        }
        .online{
            position: absolute;
            right: 5px;
            bottom: 5px;
            width: 20px;
            height: 20px;
            background-color: green;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="profile">
     <span class="online"></span>
    </div>
</body>
</html>
